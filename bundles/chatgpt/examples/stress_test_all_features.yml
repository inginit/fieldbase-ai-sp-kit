- qid: QPipeWrap
    type: info
    title: Piping showcase
    text: |
        <b>From earlier in this survey:</b>
        <br><br>
        Selected single label: <b>{{ QSinRadio.selectedLabel }}</b><br>
        Raw value (code): <b>{{ QSinRadio.value }}</b><br>
        Number of multi selections: <b>{{ QMulCheckbox.selected.size }}</b><br>
        Age + 1: <b>{{ QNumAge.value + 1 }}</b><br>
        Grid row selected label: <b>{{ QGridSingleGrid.row(1).selectedLabel }}</b><br>
        Error message catalog entry: <b>{{ QErrMsg.row(1).label }}</b><br>
        Two-decimal formatted spend: <b>${{ "%.2f" % QNumSpend.value }}</b><br>
        Rounded percent: <b>{{ round((QNumAge.value or 0) / 120 * 100) }}%</b><br>
        Inline conditional (only in piping, not in scripts): <b>{{ "Set" if QNumAge.answered else "Unanswered" }}</b><br>
        Loop iteration label: <b>{{ brandLoop.selectedLabel }}</b> (renders the current iteration when piped inside the loop)<br>

# -----------------------------------------------------------------------------
# §V — VALIDATION (extra `fail()` patterns)
# -----------------------------------------------------------------------------

- qid: QValidPair
    type: numberList
    text: Allocate 100 between two providers.
    required: True
    min: 0
    max: 100
    total: True
    options:
        1: Provider A
        2: Provider B
    validation: |
        # Multi-fail: enforce exact-100 AND at-least-25-each.
        t = sum(QValidPair.values)
        if t != 100:
            fail(QErrMsg.row(3).label)
        for c in [1, 2]:
            v = QValidPair.row(c).value
            if v is None or v < 25:
                fail("Each provider must get at least 25 points.")

