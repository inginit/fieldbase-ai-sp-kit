# =============================================================================
# DSL STRESS TEST — full coverage of types / properties / accessors / styles
# =============================================================================
#
# Synthetic survey designed to exercise the entire authoring surface in one
# document. Every canonical question type is represented at least once. Every
# style (per §4 of CLAUDE.md) is rendered at least once. All major properties
# fire. The most error-prone surfaces (loops, mixGrid, lookup variants,
# annotations, scripts, validation, quotas, piping, multi-country) get a
# section each.
#
# This is NOT a real survey — it's a contract test for the platform. Run it
# through the validator + every lint check; behaviour-test it in preview.
#
# !HUMAN — Quotas (Section §QUO) require a `qtBattery` group with 4 cells.
# !HUMAN — Lookup taxonomies (Section §LU) require uploads via the lookup
#          wizard before fielding.
#
# Layout:
#   §H   Header  — hCountry punch, QErrMsg, info intros
#   §S   Singles — all five styles, specify, exclusive, anchor, image
#   §M   Multis  — all five styles, min/max/exact, exclusive opt-out
#   §R   Rank
#   §O   Opens (open / openList) — text / textarea, input.*
#   §N   Numbers (number / numberList) — slider / total / sum
#   §G   Grids — gridSingle (grid + paired), gridMulti, gridNumber
#   §X   mixGrid — every supported child column type
#   §LU  Lookup — searchInput / dropdown / cascading / multi / matchOnly
#   §A   Annotations (research modules — stubs per CLAUDE.md §2)
#   §F   Flow — page, block, loop (with cross-iteration access), if/elif, script, note
#   §V   Validation — `fail()` patterns piped from QErrMsg
#   §QUO Quotas — least-fill assignment, fill(), reads
#   §P   Piping  — every common pipe expression
#   §END Close-out
#   §L   Reusable lists (at the bottom per CLAUDE.md §5.2)
#   §DELTA delta-log
#
# =============================================================================

# -----------------------------------------------------------------------------
# §H — HEADER
# -----------------------------------------------------------------------------

# Multi-country pattern — punch hCountry from request.param at the top.
# Per CLAUDE.md §"Multi-country authoring": every country gate reads from
# hCountry.value, never from request.param("lang") directly.
- script: |
    lang = request.param("lang")
    if lang == "en-US":
        hCountry.set(1)
    elif lang == "en-GB":
        hCountry.set(2)
    elif lang == "de-DE":
        hCountry.set(3)
    elif lang == "ja-JP":
        hCountry.set(4)
    else:
        hCountry.set(1)

- qid: hCountry
    type: single
    visibility: hide
    title: Country (derived from URL lang param)
    options:
        1: United States
        2: United Kingdom
        3: Germany
        4: Japan

# Error-message catalog — every fail() pipes from here.
- qid: QErrMsg
    type: multi
    visibility: hide
    title: Validation error messages
    options:
        1: Please provide a response.
        2: Please enter a number.
        3: Total must equal 100.
        4: Total must equal the target above.
        5: Pick at least one of the listed options.
        6: That ZIP code isn't in our footprint.
        7: Please enter at least 4 characters.
        8: Please enter a valid US phone number.

- qid: Intro
    type: info
    title: Welcome
    text: |
        Welcome to the platform stress-test survey.
        <br><br>
        This survey exercises every canonical question type and property —
        you'll see <b>singles</b>, <b>multis</b>, <b>grids</b>, <b>loops</b>,
        <b>lookups</b> and more. It's synthetic test data, not a real survey.

# -----------------------------------------------------------------------------
# §S — SINGLE (5 styles + specify + exclusive + anchor + image)
