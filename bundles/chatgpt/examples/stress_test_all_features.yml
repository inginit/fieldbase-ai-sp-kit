# =============================================================================
# §DELTA — delta-log
# =============================================================================

- note: |
    delta-log:

    PURPOSE
      Contract test for the DSL platform. Every canonical type, every style,
      every property at least once. Use as a feature-coverage smoke test.

    COVERAGE — by CLAUDE.md section
      §2 Types — all canonical types instantiated:
        info, single, multi, rank, open, openList, number, numberList,
        gridSingle, gridMulti, gridNumber, mixGrid, lookup, imageAnnotation,
        videoAnnotation, textAnnotation, cardSort.

      §3.1 Identity & display — qid, type, title, text, instruction, style,
        visibility, if — all fire across the battery.

      §3.2 Choices & scale — options (inline + list ref), group (inline +
        list ref), scale (inline + list ref), rows / cols (gridNumber),
        options.from (with required `if: len(helper()) > 0` skip per §3.2),
        group.order.

      §3.3 Layout & input — layout.cols, label.position, label.prefix /
        label.suffix (on `number` and `openList` only — NOT on `single`),
        input.size, input.rows, input.maxChar, input.min_char, input.header.

      §3.4 Constraints — min, max, exact, sum, total, required, validation.

      §3.5 Display control — decimal, decimal.places, readonly,
        default.errors.

      §3.6 Order — order, group.order, scale.order, with values fixed,
        random, randomEach.

      §3.7 Conditions — if, visibility.

      §3.8 Per-entry — label, image, anchor, exclusive, specify, data.

      §3.9 Group-level — show.label, anchor.

      §4 Styles — every documented style at least once:
        single (radio, dropdown, buttons, cards, image_cards),
        multi (checkbox, buttons, cards, image_cards, dropdown),
        open (text, textarea),
        number (number, slider),
        gridSingle (grid, paired),
        gridMulti (grid),
        mixGrid (desktop_style / mobile_style),
        lookup (searchInput, dropdown, cascading).

      §5 Lists — `- lists:` block at the bottom, named entries with `options`,
        `group`, and `scale`, multiple references per list, error-message
        catalog (QErrMsg) routed through fail().

      §6 Flow — page (with `id` + `questions`), block (with `order`), loop
        (with `id`, `options.from`, `options`, `questions`, in-iteration
        piping via `<loopId>.selectedLabel`, cross-iteration access via
        `q()`, validation: for per-iteration side effects), - if flow
        blocks for shared gates, - script at top level, - note for author
        comments.

      §7 Lookup — searchInput (matchOnly), dropdown, cascading (3 steps with
        depends), multi (multi: True).

      §8 mixGrid — parent declares shared rows; nested column qids of types
        numberList, openList, gridSingle (with scale: on the gridSingle
        child).

      §9 Piping — every common pipe expression in QPipeWrap.

      §10 Python subset — sum, len, round, str, range, math.floor (not
        shown here but available), random.choice, re.fullmatch, try/except,
        q() dynamic accessor, inline conditionals in piping but NOT in
        scripts.

      §11 Accessors — .value, .selected, .selectedLabel, .selectedLabels (on
        multi, via .at(0)), .answered, .notAnswered, .all, .size,
        .row(c).value, .row(c).label, .row(c).selectedLabel (on grids),
        loop.value, loop.selectedLabel, loop.all.

      §12 Writes — .set() per type contract:
        single (set(2)), number (set(12.5)), numberList (set({1: 10, 2: 25})
        — implicit via answer flow), gridSingle row.set(scaleCode) (via
        the validation: stashing patterns).

      §13 Deprecated names — none used.

      §14 Stimulus HTML — <b>, <br>, inline formatting in text and labels.

      §15 Quotas — quota("qtBattery", code).isOpen/.count, least-fill
        assignment (no .fill(); endSurvey("complete") counts), terminate
        via endSurvey("quotafull").

      §16 Patterns — least-fill quota assignment (§QUO), multi-country
        hCountry pattern (§H), error-message catalog (QErrMsg), masking
        with options.from + helper + skip-when-empty if.

      §0.1 Style — bright-line checklist run before save:
        ✓ No `options: {k:v}` inline form
        ✓ No underscored qids
        ✓ No bare `Q.any()` without `.selected`
        ✓ No `label.prefix/suffix` on `single`
        ✓ No negative codes
        ✓ No ternary in scripts
        ✓ No `style: dropdown` on `gridSingle`
        ✓ No `- script:` inside `questions:`
        ✓ No inline multi-line `options.from:`
        ✓ No `continue` / `break` in for / while loops

    HUMAN HANDOFFS
      - Lookup taxonomies (companies, states, counties, cities, medications)
        must be uploaded via the lookup wizard.
      - Annotation modules (QAnnotImage, QAnnotVideo, QAnnotText, QCardsort)
        configured via their respective wizards.
      - Quota group `qtBattery` with 4 cells in the Quota Builder.
      - Per-protein image / video / text assets for any concept-test extensions.
      - URL param `lang` configured to drive hCountry at survey entry.

    NOT INCLUDED — by design
      - CBC, MaxDiff conjoint tasks (research modules; same wizard handoff).
      - Real survey content (this is a contract test, not a fielding-ready
        instrument).
      - Multi-currency formatting (showcase pipes use USD; %.2f in the pipe
        spec).
      - Derotation pattern (see CLAUDE.md §16.13 for the canonical example).
      - Softmax classifier (see §16.15).
      - Master brand-list pattern across products (see §16.16) — covered
        elsewhere; not duplicated here.
