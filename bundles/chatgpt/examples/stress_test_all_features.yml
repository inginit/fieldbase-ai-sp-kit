# -----------------------------------------------------------------------------
# §F — FLOW BLOCKS (page, block, loop, if, script, note)
# -----------------------------------------------------------------------------

# page: groups multiple questions on one screen. Required `id:`.
- page:
    id: demoPage
    questions:
        - qid: QDemoGender
            type: single
            text: What is your gender?
            options:
                1: Male
                2: Female
                3: Non-binary
                4: Prefer not to answer

        - qid: QDemoZip
            type: open
            text: ZIP / postal code
            input.size: 10
            input.maxChar: 10
            validation: |
                v = QDemoZip.value
                # !HUMAN — replace with lookup against zip-footprint taxonomy.
                if v is None or len(v) < 5:
                    fail(QErrMsg.row(6).label)

# block: structural grouping (no rendering effect, can carry `order:`).
- block:
    id: lifestyleBlock
    order: random
    questions:
        - qid: QLifeExercise
            type: single
            text: How often do you exercise?
            options:
                1: Daily
                2: Several times a week
                3: Weekly
                4: Less than weekly
                5: Never

        - qid: QLifeDiet
            type: single
            text: Which dietary pattern best describes you?
            options:
                1: Omnivore
                2: Pescetarian
                3: Vegetarian
                4: Vegan
                5:
                    label: Other (specify)
                    specify: True

# Helper script defined BEFORE the loop that uses it. options.from must be
# a helper call, not inline code (per CLAUDE.md §0.1).
- script: |
    def conceptCodes():
        # Drive the loop over the codes the respondent picked at QMulCards.
        result = []
        for c in QMulCards.selected:
            result.append(c)
        return result

# loop: iterate over selected brands. Demonstrates:
#   - id (loop variable name)
#   - options.from (helper call)
#   - options (full domain, required when options.from is set)
#   - DIRECT children (no `questions:` wrapper — loop is control-flow, per §6.3)
#   - `- script:` block inside the loop for per-iteration side effects
#     (validation: also works; both are canonical patterns)
- loop:
    id: brandLoop
    options.from: conceptCodes()
    options: brandsLong
    - qid: QLoopRating
        type: number
        text: Rate {{ brandLoop.selectedLabel }} out of 10.
        required: True
        min: 0
        max: 10

    - qid: QLoopWhy
        type: open
        style: textarea
        if: QLoopRating.value < 4
        text: Why did you give {{ brandLoop.selectedLabel }} a low rating?
        required: True
        input.rows: 3

    - script: |
        # Per-iteration side effect. Runs once per iteration in that
        # iteration's context — bare QLoopRating resolves to this
        # iteration's rating; brandLoop.value is the current code.
        if QLoopRating.value is not None and QLoopRating.value < 4:
            hLowRaters.row(brandLoop.value).set(1)

- qid: hLowRaters
    type: numberList
    visibility: hide
    title: Low-rater flag per brand (1 = low-rater commented)
    options: brandsLong

# if-flow block: conditional gate wrapping multiple questions (preferred over
# inline `if:` on each per CLAUDE.md mistake #50).
- if hCountry.value == 1:
    - qid: QUSPhone
        type: open
        text: US phone number?
        input.size: 14
        input.maxChar: 14
        validation: |
            v = QUSPhone.value
            if v is None or not re.fullmatch(r"^\(?\d{3}\)?[\s-]?\d{3}[\s-]?\d{4}$", v):
                fail(QErrMsg.row(8).label)

    - qid: QUSNotify
        type: single
        text: May we contact you about future studies?
        options:
            1: Yes
            2: No

# elif-style with separate flow blocks.
- if hCountry.value == 2:
    - qid: QUKPhone
        type: open
        text: UK phone number?
        input.size: 16
        input.maxChar: 16

# Top-level script for derived metrics. Demonstrates:
#   - q() dynamic accessor for cross-iteration reads
#   - sum / avg builtin
#   - random.choice / math.floor
#   - try / except
#   - print() for debug
- script: |
    # Average rating across all brand-loop iterations.
    total = 0
    n = 0
    for c in brandLoop.all:
        # Cross-iteration accessor: QLoopRating_[c] resolves to that iteration.
        v = q("QLoopRating", c).value
        if v is not None:
            total = total + v
            n = n + 1
    if n > 0:
        hAvgRating.set(total / n)
        print("Average brand rating:", hAvgRating.value)

    # Random sample of one loop code (for spotlight in close-out).
    try:
        codes = brandLoop.all
        if len(codes) > 0:
            hSpotlight.set(random.choice(codes))
    except:
        # Defensive — should never fire, but safe.
        hSpotlight.set(None)

    # Score-based segment classification (no inline ternaries per §10.2).
    avg = hAvgRating.value
    if avg is None:
        hSegment.set(None)
    elif avg >= 8:
        hSegment.set(1)  # Premium
    elif avg >= 5:
        hSegment.set(2)  # Standard
    else:
        hSegment.set(3)  # Light

- qid: hAvgRating
    type: number
    visibility: hide
    title: Average brand rating

- qid: hSpotlight
    type: number
    visibility: hide
    title: Randomly selected brand code for close-out spotlight

- qid: hSegment
    type: single
    visibility: hide
    title: Segment derived from hAvgRating
    options:
        1: Premium
        2: Standard
        3: Light

# - note: block — author-facing scratch, not rendered to respondent.
- note: |
    Coverage note for human reviewer:
    The loop above demonstrates:
      - options.from + options (the full-domain disclosure rule from §3.2)
      - in-iteration piping via {{ brandLoop.selectedLabel }}
      - per-iteration side effect via validation: (not - script:)
      - cross-iteration access via q("QLoopRating", c) outside the loop
    See delta-log for the full feature checklist.

# -----------------------------------------------------------------------------
# §QUO — QUOTAS (least-fill assignment)
# -----------------------------------------------------------------------------
#
# !HUMAN — Build a quota group named `qtBattery` with 4 cells (codes 1-4)
# in the Quota Builder before fielding. The script reads .isOpen/.count and
# ASSIGNS the least-full cell to a hidden; endSurvey("complete") counts it once
# (no .fill() — see §15).

- script: |
    # Least-fill assignment: pick an open cell with minimum count.
    open_cells = []
    for c in [1, 2, 3, 4]:
        if quota("qtBattery", c).isOpen:
            open_cells.append(c)

    if len(open_cells) == 0:
        # All cells full — terminate with quotafull status.
        endSurvey("quotafull")
    else:
        # Pick the open cell with the smallest count (least-fill).
        best = open_cells[0]
        best_count = quota("qtBattery", best).count
        for c in open_cells:
            cnt = quota("qtBattery", c).count
            if cnt < best_count:
                best = c
                best_count = cnt
        hQuotaCell.set(best)
        # No .fill() — the assignment is enough; endSurvey("complete") counts the cell once.

- qid: hQuotaCell
    type: single
    visibility: hide
    title: Assigned quota cell (1-4)
    options:
        1: Cell A
        2: Cell B
        3: Cell C
        4: Cell D

# -----------------------------------------------------------------------------
