# -----------------------------------------------------------------------------
# §X — MIXGRID (every supported child type)
# -----------------------------------------------------------------------------
#
# Per CLAUDE.md §8: child columns can be `single`, `multi`, `rank`, `openList`,
# `numberList`, `gridSingle`. Children CANNOT re-declare options/options.from/
# group/order — the row domain comes from the parent only. The per-column
# answer domain comes from the column's own type (number = numeric input;
# openList = text per row; etc.). Per-column rendering picks up `scale:` for
# the column's answer set on a `gridSingle` child.
- qid: QMixGrid
    type: mixGrid
    text: For each brand below, give us five pieces of information.
    options: brandsTopN
    desktop_style: wide
    mobile_style: stacked
    columns:
