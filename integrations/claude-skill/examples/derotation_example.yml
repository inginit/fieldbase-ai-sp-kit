# surveyid: derotation

- note: |
    DEROTATION EXAMPLE — coded per the user-revised pattern (2026-05-10).

    Scenario: a concept test with 5 concepts in the pool (Concept A–E). Each
    respondent sees 2 concepts via least-fill assignment, then answers the
    same 5 questions about each concept inside a loop.

    Three things this example demonstrates:
      1. Inline punch inside the loop body is the preferred derotation form.
         The post-loop alternative using Q1_[c] is shown as a reference note
         right after the loop, for cases that need cross-iteration logic.
      2. Slots are organized BY CONCEPT (Q1Concept1, Q2Concept1, ..., Q5Concept1,
         then Q1Concept2, Q2Concept2, ...) — not by question. The analyst
         reads all of Concept 1's data together.
      3. Multi-stage least-fill in a single script using .minus() between picks.

# =============================================================================
# TEST SCAFFOLD
# =============================================================================

- qid: info1
    type: info
    text: random concept assignment

- script: |
    # Test scaffold — gates the derotation slot block below.
    test1.set(1)

- qid: test1
    type: single
    options:
        1: test
        2: live

# =============================================================================
# LEAST-FILL ASSIGNMENT — both concepts picked in a single script
# =============================================================================
# Prerequisite: human creates a quota named "qtconcept" with cells 1–5
# matching the conceptList options. Targets per project plan.

- script: |
    # Build candidates of open quota cells, pick concept 1, then pick concept 2
    # from the remaining open cells. hConcept (multi) carries the union for
    # the loop's options.from below.
    candidates = set()
    for code in hConcept.all:
        if quota("qtconcept", code).isOpen:
            candidates.add(code)
    if len(candidates) > 0:
        p = random.choice(sorted(candidates))
        hConcept1.set(p)
    newCandidates = candidates.minus(p)
    if newCandidates.size > 0:
        q1 = random.choice(sorted(newCandidates))
        hConcept2.set(q1)
    hConcept.set(hConcept1.selected.union(hConcept2.selected))

- qid: hConcept
    type: multi
    visibility: hide
    title: Assigned concepts (union — drives the loop)
    options: conceptList

- qid: hConcept1
    type: single
    visibility: hide
    title: Assigned concept 1 (internal)
    options: conceptList

- qid: hConcept2
    type: single
    visibility: hide
    title: Assigned concept 2 (internal)
    options: conceptList

# =============================================================================
# THE LOOP — one iteration per assigned concept, 5 questions each + inline punch
# =============================================================================

- loop:
    id: conceptLoop
    options: conceptList
    options.from: hConcept.selected
    - qid: Q1
        type: single
        text: How appealing is <b>{{ conceptLoop.selectedLabel }}</b>?
        required: True
        options: appealOptions

    - qid: Q2
        type: single
        text: How likely would you be to buy <b>{{ conceptLoop.selectedLabel }}</b>?
        required: True
        options: likelyOptions

    - qid: Q3
        type: open
        style: textarea
        text: What stood out about <b>{{ conceptLoop.selectedLabel }}</b>?
        required: True
        input.size: 40
        input.rows: 3

    - qid: Q4
        type: multi
        text: Which of the following smartphone brands have you personally used in the past 12 months?
        order: random
        options:
            1: Apple
            2: Samsung
            3: Xiaomi
            4: OPPO
            5: vivo
            6: Google Pixel
            7: Huawei
            8: Motorola
            99:
                label: None of these
                anchor: True

    - qid: Q5
        type: gridSingle
        text: Thinking about {{ Q2.selectedLabel }}, how satisfied are you with each of the following?
        order: random
        options:
            1: Camera quality
            2: Battery life
            3: Ease of use
            4: App ecosystem
            5: Value for money
        scale:
            1: Very dissatisfied
            2: Somewhat dissatisfied
            3: Neither satisfied nor dissatisfied
            4: Somewhat satisfied
            5: Very satisfied

    - script: |
        # Inline derotation punch — runs once per iteration in this
        # iteration's context. Bare Q1/Q2/... resolve to this concept's
        # answers; conceptLoop.value gives the current concept code.
        # Type-precise accessors: .value for scalars, .selected for collections.
        iter = conceptLoop.value
        print("loop index ", iter)
        if Q1.answered:                          # single
            q("Q1Concept", iter).set(Q1.value)
        if Q2.answered:                          # single
            q("Q2Concept", iter).set(Q2.value)
        if Q3.answered:                          # open
            q("Q3Concept", iter).set(Q3.value)
        if Q4.answered:                          # multi
            q("Q4Concept", iter).set(Q4.selected)
        if Q5.answered:                          # gridSingle — row-by-row
            for c in Q5.all:
                q("Q5Concept", iter).row(c).set(Q5.row(c).value)

# ── Reference: post-loop punch (alternative) ─────────────────────────────────
- note: |
    Alternative — post-loop punch using Qx_[c] cross-iteration accessors.
    Use this form when the punch logic needs to span multiple loops or run
    outside the per-iteration context. Inline (above) is preferred otherwise.

    for c in conceptLoop.all:
        print("loop options", conceptLoop.all)
        if Q1_[c].answered:                     # single
            q("Q1Concept", c).set(Q1_[c].value)
        if Q2_[c].answered:                     # single
            q("Q2Concept", c).set(Q2_[c].value)
        if Q3_[c].answered:                     # open
            q("Q3Concept", c).set(Q3_[c].value)
        if Q4_[c].answered:                     # multi
            q("Q4Concept", c).set(Q4_[c].selected)
        if Q5_[c].answered:                     # gridSingle — row-by-row
            for f in Q5_[c].all:
                print("Q5 value ", Q5_[c].row(f).value)
                q("Q5Concept", c).row(f).set(Q5_[c].row(f).value)

# =============================================================================
# FULL DEROTATION — 25 fixed slots organized BY CONCEPT
# =============================================================================
# One hidden question per (concept × loop question) = 5 × 5 = 25 slots.
# Slots for unshown concepts stay null. Naming: <questionId>Concept<conceptCode>.
# Organization is BY CONCEPT (Q1–Q5 for Concept 1 together, then Q1–Q5 for
# Concept 2, etc.) so the analyst can read each concept's full panel in one
# pass — instead of jumping across the export for Q1's per-concept rows.

- if test1.value == 1:
    # ── Concept 1 derotation slots ───────────────────────────────────────────
    - qid: Q1Concept1
        type: single
        visibility: hide
        title: Q1 → Concept A
        options: appealOptions

    - qid: Q2Concept1
        type: single
        visibility: hide
        title: Q2 → Concept A
